<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ครุภัณฑ์-ศว</title>
<link rel="icon" href="https://i.postimg.cc/Bn4WB8z7/r-pphaph1.jpg">
<link rel="apple-touch-icon" href="https://i.postimg.cc/Bn4WB8z7/r-pphaph1.jpg">
<meta name="theme-color" content="#0B7A6B">
<style>
  html, body { margin: 0; height: 100%; background: #F2F5F7; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #fallback { font-family: system-ui, sans-serif; padding: 24px; color: #3A4A57; }
  #fallback a { color: #0B7A6B; }
</style>
</head>
<body>
<iframe id="app" title="ระบบครุภัณฑ์ ศูนย์วิจัยและพัฒนาวัสดุอุตสาหกรรมสร้างสรรค์"
        allow="clipboard-write; fullscreen"></iframe>
<noscript>
  <div id="fallback">กรุณาเปิด JavaScript หรือ
    <a href="https://script.google.com/macros/s/AKfycbzeMA5icJW58pVtLEocqSUOjs-OU8NUKrpt70iaF8eQ1Kf7vha7gBvFSNjmGtW5xMvClA/exec">เปิดระบบโดยตรง</a>
  </div>
</noscript>
<script>
  // ลิงก์ Web app ของ Apps Script (ถ้า deploy ใหม่แล้วลิงก์เปลี่ยน ให้แก้บรรทัดนี้บรรทัดเดียว)
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzeMA5icJW58pVtLEocqSUOjs-OU8NUKrpt70iaF8eQ1Kf7vha7gBvFSNjmGtW5xMvClA/exec';

  // ส่งต่อเฉพาะพารามิเตอร์ที่ระบบใช้ (?id=EQ-0001, ?page=admin, ?page=tech, ?code=...)
  var ALLOWED = ['id', 'page', 'code'];
  var incoming = new URLSearchParams(window.location.search);
  var out = new URLSearchParams();
  ALLOWED.forEach(function (k) {
    var v = incoming.get(k);
    if (v) out.set(k, v);
  });
  var qs = out.toString();
  document.getElementById('app').src = GAS_URL + (qs ? '?' + qs : '');
</script>
</body>
</html>
